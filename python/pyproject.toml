[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wyrlo"
version = "0.1.1"
description = "Stop RAG hallucinations: verify LLM answers against their sources and say \"I don't know\" instead of guessing."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mayeul FLORY, entrepreneur individuel (FUSION-IA)", email = "contact@wyrlo.io" }]
keywords = [
  "rag", "llm", "hallucination", "hallucination-detection", "guardrails", "llm-guardrails",
  "grounding", "fact-checking", "retrieval-augmented-generation", "langchain", "llamaindex",
  "ai-safety", "prompt-injection", "wyrlo",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]
llamaindex = ["llama-index-core>=0.14"]

[project.urls]
Homepage = "https://www.wyrlo.io"
Source = "https://github.com/WYRLO-AI/wyrlo-sdk"
Documentation = "https://www.wyrlo.io/docs"
Issues = "https://github.com/WYRLO-AI/wyrlo-sdk/issues"
Changelog = "https://github.com/WYRLO-AI/wyrlo-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyrlo = ["py.typed"]
